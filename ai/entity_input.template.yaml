    module_group: "Masters"

  backend:
    table_name: "ledger_groups"
    route_base: "/api/ledger-groups"
    primary_key:
      name: "id"
      type: "uuid"
    fields:
      - name: "name"
        type: "string"
        nullable: false
        default: null
        enum_values: []
      - name: "parent_id"
        type: "uuid"
        nullable: true
        default: null
        enum_values: []
    constraints:
