          references: "ledger_groups.id"
          on_delete: "SET NULL"
      checks: []
    indexes:
      - name: "ix_ledger_groups_parent_id"
        columns: ["parent_id"]
        unique: false
      - name: "ix_ledger_groups_name"
        columns: ["name"]
        unique: false
    pagination:
      default_limit: 20
      max_limit: 100
    seed_data: []

  permissions:
    required_actions: ["get", "gets", "post", "put", "patch", "delete"]
    optional_actions: ["options"]
    role_mapping_hint:
      viewer: ["gets", "get"]
      manager: ["post", "put", "patch"]
      admin: ["delete"]

  web:
    pages: ["list", "detail", "form"]
    list_columns: ["name", "parent_name", "is_active"]
    filters: ["name", "is_active"]
    sort:
      active: "name"
      direction: "asc"
    nav_visibility_permission: "ledger_group.gets"
    form_validations:
